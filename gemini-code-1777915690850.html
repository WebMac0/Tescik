<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Radio Chaos - GitHub Auto-Player</title>
    <style>
        body { background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .player-container { background: #181818; padding: 30px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); text-align: center; width: 420px; border: 1px solid #333; }
        h1 { color: #1DB954; font-size: 24px; margin-bottom: 5px; letter-spacing: 2px; }
        #current-track { color: #fff; margin-bottom: 20px; font-size: 14px; background: #282828; padding: 10px; border-radius: 5px; }
        canvas { background: #000; border-radius: 10px; width: 100%; height: 150px; margin-bottom: 20px; border: 1px solid #1DB954; }
        audio { width: 100%; margin-bottom: 20px; }
        .playlist { text-align: left; background: #000; border-radius: 10px; padding: 10px; max-height: 200px; overflow-y: auto; border: 1px solid #333; }
        .track-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #222; font-size: 13px; color: #b3b3b3; transition: 0.3s; }
        .track-item:hover { background: #1DB954; color: #000; }
        .playing { color: #1DB954; font-weight: bold; border-left: 3px solid #1DB954; padding-left: 7px; }
    </style>
</head>
<body>

    <div class="player-container">
        <h1>PIKSELOWY CHAOS</h1>
        <div id="current-track">Ładowanie utworów z GitHuba...</div>
        
        <canvas id="visualizer"></canvas>
        
        <audio id="player" controls></audio>
        
        <div class="playlist" id="playlist">
            </div>
    </div>

    <script>
        // === KONFIGURACJA GITHUBA ===
        const username = 'TWOJ_NICK_NA_GITHUBIE'; // Wpisz swój nick
        const repo = 'NAZWA_REPOZYTORIUM';        // Wpisz nazwę repo
        const folderPath = '';                   // Zostaw puste, jeśli muzyka jest w głównym folderze

        const player = document.getElementById('player');
        const playlistEl = document.getElementById('playlist');
        const currentTrackEl = document.getElementById('current-track');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        let audioCtx, analyser, source, initialized = false;

        // 1. POBIERANIE LISTY PLIKÓW Z GITHUBA
        async function fetchMusic() {
            const url = `https://api.github.com/repos/${username}/${repo}/contents/${folderPath}`;
            
            try {
                const response = await fetch(url);
                const files = await response.json();
                
                // Filtrujemy tylko pliki .mp3
                const musicFiles = files.filter(file => file.name.endsWith('.mp3'));

                if (musicFiles.length === 0) {
                    currentTrackEl.innerText = "Nie znaleziono plików MP3!";
                    return;
                }

                playlistEl.innerHTML = ''; // Czyścimy listę
                musicFiles.forEach((file, index) => {
                    const item = document.createElement('div');
                    item.className = 'track-item';
                    // Usuwamy ".mp3" z nazwy, żeby ładniej wyglądało
                    const title = file.name.replace('.mp3', '');
                    item.innerText = `${index + 1}. ${title}`;
                    
                    item.onclick = () => playTrack(file.download_url, title, item);
                    playlistEl.appendChild(item);
                });

                currentTrackEl.innerText = "Wybierz nutę z listy!";

            } catch (error) {
                currentTrackEl.innerText = "Błąd połączenia z GitHub API";
                console.error(error);
            }
        }

        // 2. FUNKCJA ODTWARZANIA
        function playTrack(url, title, element) {
            player.src = url;
            currentTrackEl.innerText = `GRA TERAZ: ${title}`;
            
            // Zaznaczanie na liście
            document.querySelectorAll('.track-item').forEach(el => el.classList.remove('playing'));
            element.classList.add('playing');

            player.play();
            if (!initialized) initVisualizer();
        }

        // 3. WIZUALIZACJA
        function initVisualizer() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(player);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 128;
            draw();
            initialized = true;
        }

        function draw() {
            requestAnimationFrame(draw);
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const barWidth = (canvas.width / bufferLength) * 2.5;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = dataArray[i] / 1.8;
                ctx.fillStyle = `rgb(29, ${barHeight + 100}, 84)`;
                ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
                x += barWidth;
            }
        }

        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        
        // Start systemu
        fetchMusic();
    </script>
</body>
</html>
